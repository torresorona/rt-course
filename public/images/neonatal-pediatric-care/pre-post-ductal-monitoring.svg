<svg viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="pd-terra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a85c3a"/>
    </marker>
    <marker id="pd-mix" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="778" height="498" rx="18" fill="#faf9f7" stroke="#e8e4dd" stroke-width="2"/>
  <text x="390" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1f1b17">Pre- &amp; Post-Ductal Saturation Monitoring</text>
  <text x="390" y="62" text-anchor="middle" font-size="13" fill="#7a7068">The right hand is sampled before the ductus arteriosus; a foot is sampled after it</text>

  <!-- Baby schematic -->
  <circle cx="390" cy="130" r="33" fill="#f5f3ef" stroke="#b8b0a2" stroke-width="2"/>
  <rect x="353" y="162" width="74" height="116" rx="24" fill="#f5f3ef" stroke="#b8b0a2" stroke-width="2"/>
  <path d="M357,184 L272,206" stroke="#f5f3ef" stroke-width="18" stroke-linecap="round"/>
  <path d="M423,184 L508,206" stroke="#f5f3ef" stroke-width="18" stroke-linecap="round"/>
  <path d="M373,276 L350,380" stroke="#f5f3ef" stroke-width="20" stroke-linecap="round"/>
  <path d="M407,276 L430,380" stroke="#f5f3ef" stroke-width="20" stroke-linecap="round"/>

  <!-- Aorta schematic -->
  <path d="M384,292 L384,200 Q384,178 404,178 L468,178" fill="none" stroke="#c4704b" stroke-width="3.5"/>
  <path d="M384,192 L300,204" fill="none" stroke="#c4704b" stroke-width="3" marker-end="url(#pd-terra)"/>
  <path d="M384,292 L426,366" fill="none" stroke="#8a6d8a" stroke-width="3" marker-end="url(#pd-mix)"/>
  <!-- ductus arteriosus -->
  <path d="M468,178 Q448,206 400,234" fill="none" stroke="#a85c3a" stroke-width="4.5"/>
  <circle cx="430" cy="200" r="12" fill="#c4704b" stroke="#faf9f7" stroke-width="2"/>
  <text x="430" y="204" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">DA</text>
  <text x="478" y="166" font-size="11.5" font-weight="700" fill="#a85c3a">ductus arteriosus</text>
  <text x="478" y="181" font-size="11" fill="#7a7068">mixes in O₂-poor blood</text>

  <!-- Preductal probe + leader -->
  <circle cx="296" cy="205" r="9" fill="#6b8f5e"/>
  <line x1="246" y1="248" x2="290" y2="208" stroke="#6b8f5e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="56" y="226" width="190" height="74" rx="12" fill="#ecf0e8" stroke="#6b8f5e" stroke-width="1.8"/>
  <text x="151" y="250" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3f5a34">PREDUCTAL</text>
  <text x="151" y="269" text-anchor="middle" font-size="11.5" fill="#5c544d">Right hand · before ductus</text>
  <text x="151" y="290" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3f5a34">SpO₂ 97% · no mixing</text>

  <!-- Postductal probe + leader -->
  <circle cx="430" cy="372" r="9" fill="#a85c3a"/>
  <line x1="545" y1="346" x2="440" y2="372" stroke="#c4704b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="545" y="312" width="200" height="74" rx="12" fill="#fbe9e0" stroke="#c4704b" stroke-width="1.8"/>
  <text x="645" y="336" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a85c3a">POSTDUCTAL</text>
  <text x="645" y="355" text-anchor="middle" font-size="11.5" fill="#5c544d">Foot · after ductus</text>
  <text x="645" y="376" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a85c3a">SpO₂ 89% · mixing</text>

  <!-- Key callout -->
  <rect x="60" y="410" width="384" height="78" rx="12" fill="#ffffff" stroke="#c4704b" stroke-width="2"/>
  <text x="252" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#1f1b17">Preductal − Postductal &gt; 5% difference</text>
  <text x="252" y="460" text-anchor="middle" font-size="12.5" fill="#5c544d">indicates a right-to-left shunt</text>
  <text x="252" y="478" text-anchor="middle" font-size="12.5" fill="#5c544d">(patent ductus arteriosus / patent foramen ovale)</text>
</svg>
