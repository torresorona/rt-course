<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#44403c">Volume–Time Scalar</text>

  <!-- axes -->
  <line x1="80" y1="60" x2="80" y2="320" stroke="#44403c" stroke-width="2"/>
  <line x1="80" y1="320" x2="610" y2="320" stroke="#44403c" stroke-width="2"/>
  <text x="30" y="190" text-anchor="middle" font-size="14" fill="#57534e" transform="rotate(-90 30 190)">Volume (mL)</text>
  <text x="345" y="360" text-anchor="middle" font-size="14" fill="#57534e">Time (sec)</text>

  <!-- zero-volume baseline -->
  <line x1="80" y1="300" x2="610" y2="300" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="600" y="316" text-anchor="end" font-size="11" fill="#a8a29e">baseline (0)</text>

  <!-- Breath: rises to peak, exhalation does NOT return to baseline -->
  <path d="M 95,300 L 160,110 C 195,150 245,210 300,235 L 360,235"
        fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>

  <!-- gap between end-expiratory volume and baseline -->
  <line x1="360" y1="235" x2="360" y2="300" stroke="#57534e" stroke-width="1.5"/>
  <line x1="355" y1="235" x2="365" y2="235" stroke="#57534e" stroke-width="1.5"/>
  <line x1="355" y1="300" x2="365" y2="300" stroke="#57534e" stroke-width="1.5"/>
  <text x="372" y="272" font-size="12" fill="#57534e">trace does not</text>
  <text x="372" y="289" font-size="12" fill="#57534e">return to baseline</text>
</svg>
