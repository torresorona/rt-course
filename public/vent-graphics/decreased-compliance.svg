<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#44403c">Pressure–Volume Loop</text>

  <!-- axes -->
  <line x1="90" y1="60" x2="90" y2="330" stroke="#44403c" stroke-width="2"/>
  <line x1="90" y1="330" x2="610" y2="330" stroke="#44403c" stroke-width="2"/>
  <text x="36" y="200" text-anchor="middle" font-size="14" fill="#57534e" transform="rotate(-90 36 200)">Volume (mL)</text>
  <text x="350" y="368" text-anchor="middle" font-size="14" fill="#57534e">Pressure (cmH₂O)</text>

  <!-- Normal reference loop (steeper slope) -->
  <path d="M 120,300 C 175,250 235,160 285,95 C 245,150 185,235 120,300 Z"
        fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="250" y="92" font-size="12" fill="#a8a29e">Normal (reference)</text>

  <!-- Current loop: flattened toward pressure axis (decreased slope) -->
  <path d="M 120,300 C 250,288 380,235 470,170 C 360,205 235,268 120,300 Z"
        fill="none" stroke="#c2410c" stroke-width="3"/>
  <text x="430" y="160" font-size="12" fill="#c2410c">Current</text>

  <!-- slope arrows (no diagnosis label) -->
  <line x1="120" y1="300" x2="285" y2="100" stroke="#c8b8ae" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="120" y1="300" x2="470" y2="175" stroke="#e0b09c" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
